name: Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks Commit Range
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan only commits introduced by this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${BASE_REF}"
            LOG_OPTS="origin/${BASE_REF}..HEAD"
          elif [[ "${EVENT_NAME}" == "push" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            LOG_OPTS="${BEFORE_SHA}..${CURRENT_SHA}"
          else
            LOG_OPTS="-1 ${CURRENT_SHA}"
          fi
          gitleaks git . --config .gitleaks.toml --redact=100 --no-banner --log-opts="${LOG_OPTS}"

  client-bundle-guard:
    name: Client and Bundle Secret Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build with client secret guard
        run: |
          pnpm exec vitest run server/routers/gif.test.ts server/clientSecretGuard.test.ts
          pnpm build

  dependency-observability:
    name: OSV Dependency Observability
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install checksum-verified OSV-Scanner
        env:
          OSV_VERSION: 2.4.0
        run: |
          set -euo pipefail
          curl -fsSLO "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          curl -fsSLO "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_SHA256SUMS"
          grep "osv-scanner_linux_amd64" osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64

      - name: Report known dependency vulnerabilities
        run: |
          set +e
          ./osv-scanner_linux_amd64 scan source --lockfile pnpm-lock.yaml --format table
          status=$?
          if [[ "$status" -ne 0 ]]; then
            echo "::warning title=OSV dependency debt detected::The deprecated repository contains known dependency vulnerabilities. See this step for the full report; remediation remains tracked separately from the credential-containment PR."
            {
              echo "### OSV dependency observability"
              echo
              echo "Known dependency vulnerabilities were detected (scanner exit code \`$status\`)."
              echo "This report is intentionally non-blocking so the server-side credential containment can merge; it does not mark dependency remediation complete."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No known dependency vulnerabilities detected." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
